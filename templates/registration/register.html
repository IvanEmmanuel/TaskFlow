{% extends "base.html" %}


{% block title %}
    Crear cuenta
{% endblock title %}
    

{% block content %}
    
    <h1>Crear cuenta</h1>
    
    <form method="POST">

        {% csrf_token %}
        
        {{ form.as_p }}

        <button type="submit">
            Registrarse
        </button>

    </form>

    <p>
        ¿Ya tienes una cuenta?
        <a href="{% url 'login' %}">
            Iniciar sesión
        </a>
    </p>

{% endblock content %}
