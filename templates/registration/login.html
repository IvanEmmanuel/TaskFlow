{% extends "base.html" %}


{% block title %}
    Iniciar Sesión
{% endblock title %}


{% block content %}
    
    <h1>Iniciar Sesión</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Iniciar Sesión
        </button>
        <p>
            ¿No tienes una cuenta?
            <a href="{% url 'register' %}">
                Crear una cuenta
            </a>
        </p>

        <p>
            <a href="{% url 'password_reset' %}">
                ¿Olvidaste tu contraseña?
            </a>
        </p>
    </form>
    
{% endblock content %}
