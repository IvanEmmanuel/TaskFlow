{% extends "base.html" %}


{% block title %}
    Eliminar Tarea
{% endblock title %}


{% block content %}
    
    <h1>Eliminar Tarea</h1>

    <p>
        Estás seguro de que quieres Eliminar
        <strong>{{ task.title }}</strong>
    </p>
    <form method="POST">
        {% csrf_token %}

        <button type="submit">
            Si, eliminar
        </button>
    </form>
    <a href="{% url 'task_detail' task.id %}">
        Cancelar
    </a>

{% endblock content %}
