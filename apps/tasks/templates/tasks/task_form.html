<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Tarea - TaskFlow</title>
</head>
<body>

    <h1>Crear / Editar Tarea</h1>

        {{ form.as_p }}

        Volver a tareas
    </a>
    
</body>
</html>
